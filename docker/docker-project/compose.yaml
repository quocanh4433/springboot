services:

  frontend:
    image: react-image
    build:
      context: ./frontend-react
      dockerfile: Dockerfile

    container_name: react-container

    ports:
      - "5173:5050"

    depends_on:
      - backend


  backend:
    image: springboot-image
    build:
      context: ./backend-spring
      dockerfile: Dockerfile

    container_name: springboot-container

    ports:
      - "8080:8080"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: demo
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword

    depends_on:
      - mysql


  mysql:
    image: mysql:8.0

    container_name: mysql-container

    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: demo
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql


volumes:
  mysql-data: